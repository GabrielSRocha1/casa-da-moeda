[toolchain]
anchor_version = "0.31.1"
solana_version = "2.3.13"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
mastter_factory = "FZ4dYHSvFs9eF1TnN9QLj5XUuhD3yWqM1us9itqjhrE9"

[programs.devnet]
mastter_factory = "FZ4dYHSvFs9eF1TnN9QLj5XUuhD3yWqM1us9itqjhrE9"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "RUST_LOG=error npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.test.ts"
