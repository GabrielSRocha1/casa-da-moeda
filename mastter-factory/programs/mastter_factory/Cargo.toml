[package]
name = "mastter_factory"
version = "1.0.0"
description = "Mastter.Digital — Smart Contract Factory multissetorial (cofres tokenizados com lastro, vesting e anti-whale)"
edition = "2021"
rust-version = "1.84"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "lib"]
name = "mastter_factory"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.31.1" }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
solana-program-test = "=2.3.13"
solana-sdk = "2.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
